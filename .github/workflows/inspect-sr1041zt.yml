name: SR1041ZT SDK Diagnose and Build

run-name: "SR1041ZT SDK build using GNUTON toolchain container"

on:
  workflow_dispatch:
  push:
    branches:
      - asuswrt_1041
  pull_request:
    branches:
      - asuswrt_1041

permissions:
  contents: read

concurrency:
  group: sr1041zt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-reference:
    name: Inspect source and build TUF-AX3000_V2 reference target
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SDK_DIR: release/src-rt-5.04axhnd.675x
      BUILD_TARGET: TUF-AX3000_V2
      TOOLCHAIN_IMAGE: gnuton/asuswrt-merlin-toolchains-docker:latest-ubuntu-20_04
      TOOLCHAIN_ENV: /home/docker/envs/bcm-hnd-ax-4.19.sh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect checkout and source helper files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sr1041zt-home" "$GITHUB_WORKSPACE/diagnostics"
          {
            echo '===== Runner identity ====='
            id
            echo '===== Workspace ownership ====='
            stat -c '%U:%G %u:%g %a %n' "$GITHUB_WORKSPACE"
            echo '===== Disk and memory ====='
            df -h
            free -h
            echo '===== Git revision ====='
            git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD
            git -C "$GITHUB_WORKSPACE" status --short
            echo '===== SDK path ====='
            if [[ -d "$GITHUB_WORKSPACE/$SDK_DIR" ]]; then
              ls -ld "$GITHUB_WORKSPACE/$SDK_DIR"
            else
              echo "ERROR: SDK directory missing: $SDK_DIR"
              exit 1
            fi
            echo '===== All maketargets files in checkout ====='
            find "$GITHUB_WORKSPACE" -type f -iname '*maketargets*' -print 2>/dev/null | head -200 || true
            echo '===== Git-tracked maketargets entries ====='
            git -C "$GITHUB_WORKSPACE" ls-files | grep -i 'maketargets' | head -200 || true
            echo '===== SDK release directory ====='
            ls -la "$GITHUB_WORKSPACE/$SDK_DIR/release" 2>&1 || true
            echo '===== Target and kernel-version references ====='
            grep -RnsE 'TUF-AX3000_V2|KERNEL_VERSION|maketargets' \
              "$GITHUB_WORKSPACE/$SDK_DIR/Makefile" \
              "$GITHUB_WORKSPACE/$SDK_DIR/make.common" \
              "$GITHUB_WORKSPACE/$SDK_DIR/target.mak" \
              "$GITHUB_WORKSPACE/$SDK_DIR/chip_profile.mak" \
              2>/dev/null | head -240 || true
          } 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/source-inspection.log"

      - name: Pull GNUTON toolchain image
        shell: bash
        run: docker pull "$TOOLCHAIN_IMAGE"

      - name: Inspect toolchain environment inside Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user 0:0 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e SDK_DIR="$SDK_DIR" \
            -v "$GITHUB_WORKSPACE:/build" \
            -v "$RUNNER_TEMP/sr1041zt-home:/tmp/sr1041zt-home" \
            -w /build \
            "$TOOLCHAIN_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              if ! getent passwd "$HOST_UID" >/dev/null; then
                getent group "$HOST_GID" >/dev/null || groupadd -g "$HOST_GID" sr1041zt-host
                useradd -u "$HOST_UID" -g "$HOST_GID" -M -d "/tmp/sr1041zt-home/home-$HOST_UID" -s /bin/bash sr1041zt-host
              fi
              BUILD_USER="$(getent passwd "$HOST_UID" | cut -d: -f1)"
              BUILD_HOME="/tmp/sr1041zt-home/home-$HOST_UID"
              mkdir -p "$BUILD_HOME"
              chown "$HOST_UID:$HOST_GID" "$BUILD_HOME"
              echo "===== Build identity matching host checkout owner ====="
              id "$BUILD_USER"
              echo "===== Toolchain env file ====="
              ls -l /home/docker/envs/bcm-hnd-ax-4.19.sh
              echo "===== Compiler check as matching user ====="
              su -s /bin/bash "$BUILD_USER" -c "export HOME=\"$BUILD_HOME\"; source /home/docker/envs/bcm-hnd-ax-4.19.sh; command -v arm-buildroot-linux-gnueabi-gcc; arm-buildroot-linux-gnueabi-gcc --version | head -1"
              echo "===== Mounted workspace ====="
              stat -c "%U:%G %u:%g %a %n" /build "/build/$SDK_DIR"
            '

      - name: Diagnose libraries and build reference target
        shell: bash
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/diagnostics/build.log"
          STATUS=0
          {
            echo '===== Build start ====='
            date -u
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Revision: $GITHUB_SHA"
            echo "SDK: $SDK_DIR"
            echo "Target: $BUILD_TARGET"
            echo "Docker image: $TOOLCHAIN_IMAGE"
            echo '===== Source tree checks inside container ====='
          } | tee "$LOG"

          docker run --rm \
            --user 0:0 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e SDK_DIR="$SDK_DIR" \
            -e BUILD_TARGET="$BUILD_TARGET" \
            -v "$GITHUB_WORKSPACE:/build" \
            -v "$RUNNER_TEMP/sr1041zt-home:/tmp/sr1041zt-home" \
            -w "/build/$SDK_DIR" \
            "$TOOLCHAIN_IMAGE" \
            /bin/bash -lc '
              set -uo pipefail
              exec > >(tee -a /build/diagnostics/build.log) 2>&1
              if ! getent passwd "$HOST_UID" >/dev/null; then
                getent group "$HOST_GID" >/dev/null || groupadd -g "$HOST_GID" sr1041zt-host
                useradd -u "$HOST_UID" -g "$HOST_GID" -M -d "/tmp/sr1041zt-home/home-$HOST_UID" -s /bin/bash sr1041zt-host
              fi
              BUILD_USER="$(getent passwd "$HOST_UID" | cut -d: -f1)"
              BUILD_HOME="/tmp/sr1041zt-home/home-$HOST_UID"
              mkdir -p "$BUILD_HOME"
              chown "$HOST_UID:$HOST_GID" "$BUILD_HOME"
              echo "===== Container build identity ====="
              id "$BUILD_USER"
              echo "===== Workspace and permissions ====="
              pwd
              stat -c "%U:%G %u:%g %a %n" /build "." router
              echo "===== maketargets candidates ====="
              find /build -type f -iname "*maketargets*" -print 2>/dev/null | head -200 || true
              echo "===== Expected helper path ====="
              if [[ -e ./release/maketargets ]]; then
                ls -l ./release/maketargets
                file ./release/maketargets || true
              else
                echo "NOTICE: ./release/maketargets is absent; not aborting before Makefile diagnostics."
              fi
              echo "===== Build as matching non-root user ====="
              su -s /bin/bash "$BUILD_USER" -c "cd /build/$SDK_DIR && export HOME=\"$BUILD_HOME\" && source /home/docker/envs/bcm-hnd-ax-4.19.sh && command -v arm-buildroot-linux-gnueabi-gcc && make \"$BUILD_TARGET\""
            '
          STATUS=$?

          echo "$STATUS" > "$GITHUB_WORKSPACE/diagnostics/build-exit-code.txt"
          {
            echo '===== Build exit code ====='
            echo "$STATUS"
            echo '===== Image files ====='
            find "$GITHUB_WORKSPACE/$SDK_DIR/image" -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | head -300 || true
            echo '===== Runner disk after build ====='
            df -h
            date -u
          } 2>&1 | tee -a "$LOG"
          exit "$STATUS"

      - name: Upload diagnostics and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sr1041zt-build-diagnostics
          if-no-files-found: warn
          path: |
            diagnostics/
            release/src-rt-5.04axhnd.675x/image/
