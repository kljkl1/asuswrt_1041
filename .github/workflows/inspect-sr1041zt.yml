
name: Inspect SR1041ZT Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "=== Revision ==="
          git rev-parse HEAD
          echo "=== Disk ==="
          df -h
          echo "=== Memory ==="
          free -h
          echo "=== CPU ==="
          nproc

      - name: Locate TUF AX3000 V2 files
        shell: bash
        run: |
          find release -type f \
            -name 'TUF_AX3000_V2.dts' -print

          echo "=== Source directories ==="
          find release -maxdepth 3 \
            -type d -print | sed -n '1,100p'

      - name: Locate build documentation
        shell: bash
        run: |
          find . -maxdepth 4 \
            \( -name 'README*' \
            -o -name 'DEV.md' \
            -o -name 'target.mak' \) \
            -type f -print | head -200

      - name: Inspect build entry, toolchain and image rules
        shell: bash
        run: |
          set -eu

          SRC="release/src-rt-5.04axhnd.675x"

          echo "===== 1. BUILD ENTRY FILES ====="
          for f in \
            release/src/Makefile \
            release/src-rt/target.mak \
            "$SRC/Makefile" \
            "$SRC/platform.mak" \
            "$SRC/platform.mk"
          do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
              wc -l "$f"
            else
              echo "NOT FOUND: $f"
            fi
          done

          echo "===== 2. MAKEFILES AND BUILD SCRIPTS ====="
          find "$SRC" -maxdepth 3 -type f \
            \( -name 'Makefile' \
            -o -name 'makefile' \
            -o -name 'platform.mak' \
            -o -name 'platform.mk' \
            -o -name 'target.mak' \
            -o -name 'build*.sh' \
            -o -name '*image*.sh' \) \
            -print | sort | sed -n '1,180p'

          echo "===== 3. MODEL AND NAND RELATED VARIABLES ====="
          grep -nE \
            'TUF-AX3000_V2|BUILD_NAME|NVSIZE|LINUX_MTD|UBI=|UBIFS=|NAND|MTD|PROFILE=' \
            release/src-rt/target.mak || true

          echo "===== 4. TOOLCHAIN DIRECTORIES ====="
          find "$SRC" -maxdepth 3 -type d \
            \( -iname '*toolchain*' -o -iname '*crosstool*' \) \
            -print | sort

          echo "===== 5. IMAGE AND FILESYSTEM COMMANDS ====="
          grep -RInE \
            'ubinize|mkfs\.ubifs|mksquashfs|fwtag|VMLINUX|image/' \
            "$SRC/Makefile" "$SRC/platform.mak" "$SRC/platform.mk" \
            "$SRC/Makefile" \
            release/src/Makefile release/src-rt/target.mak \
            2>/dev/null | sed -n '1,180p' || true

          echo "===== 6. IMAGE OUTPUT DIRECTORY ====="
          if [ -d "$SRC/image" ]; then
            find "$SRC/image" -maxdepth 2 -type f \
              -printf '%p (%s bytes)\n' | sed -n '1,100p'
          else
            echo "Image directory does not exist yet."
          fi


      - name: Inspect BCM6756 build prerequisites
        shell: bash
        run: |
          set -u
          cd release/src-rt-5.04axhnd.675x

          echo "===== 1. Chip profile rules ====="
          if [ -f chip_profile.mak ]; then
            grep -nE '6756|96756|TUF-AX3000_V2|CHIP_PROFILE' chip_profile.mak || true
          else
            echo "chip_profile.mak not found"
          fi

          echo "===== 2. Build system and image rules ====="
          grep -nE '^(all|bin|image|gen_target|kernel|TUF-AX3000_V2|rt-%|RT-%):|IMAGEDIR|BUILD_NAME|squashfs.pkgtb|\.w' build/Makefile Makefile 2>/dev/null | head -n 160 || true

          echo "===== 3. Toolchain path ====="
          TOOLCHAIN=/opt/toolchains/crosstools-arm-gcc-9.2-linux-4.19-glibc-2.30-binutils-2.32/usr/bin/arm-buildroot-linux-gnueabi-gcc
          if [ -x "$TOOLCHAIN" ]; then
            "$TOOLCHAIN" --version | head -n 2
          else
          echo "Expected compiler not found: $TOOLCHAIN"
          fi

          echo "===== 4. Related environment scripts ====="
          find /home/docker/envs -maxdepth 1 -type f -name '*675*' -o -name '*hnd*' 2>/dev/null || true
