
name: Diagnose TUF-AX3000 V2 Library Paths

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user 0:0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GNUton environment
        shell: bash
        run: |
          set -eo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19.sh

          ln -sfn /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains

          echo "===== Compiler ====="
          command -v arm-buildroot-linux-gnueabi-gcc
          arm-buildroot-linux-gnueabi-gcc --version

          echo "===== SDK directories ====="
          ls -ld "$GITHUB_WORKSPACE/release/src-rt-5.04axhnd.675x"
          ls -ld "$GITHUB_WORKSPACE/release/src-rt-5.04axhnd.675x/router-sysdep.tuf-ax3000_v2"

      - name: Diagnose library paths
        shell: bash
        run: |
          set -eo pipefail

          echo "===== Prepare workspace permissions ====="
          chown -R docker:docker "$GITHUB_WORKSPACE"

          echo "===== Create diagnostic script ====="
          cat > /tmp/diagnose-libraries.sh <<'DIAG_SCRIPT'
          #!/bin/bash
          set -eo pipefail

          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19.sh

          cd "$GITHUB_WORKSPACE/release/src-rt-5.04axhnd.675x"

          echo "===== 1. Current directory ====="
          pwd

          echo "===== 2. Verify target profile ====="
          grep -nE 'HND-96756_BASE|TUF-AX3000_V2' target.mak

          echo "===== 3. Prepare target-specific router-sysdep ====="
          if [ ! -d router-sysdep.tuf-ax3000_v2 ]; then
            echo "ERROR: router-sysdep.tuf-ax3000_v2 does not exist"
            exit 2
          fi

          rm -rf router-sysdep
          cp -ar router-sysdep.tuf-ax3000_v2 router-sysdep

          echo "===== 4. Inspect expected linker directories ====="
          for d in \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router-sysdep/wlcsm \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router-sysdep/nvram \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/arm-glibc/install/nvram/usr/lib \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/shared \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/arm-glibc/install/shared/usr/lib \
            router-sysdep \
            router-sysdep/wlan/nvram/prebuilt
          do
            echo "----- $d -----"
            if [ -d "$d" ]; then
              ls -la "$d" | sed -n '1,30p'
            else
              echo "DIRECTORY MISSING"
            fi
          done

          echo "===== 5. Locate libraries and symlinks ====="
          find . \( -type f -o -type l \) \( \
            -name 'libnvram.so' -o \
            -name 'libnvram.so.*' -o \
            -name 'libnvram.a' -o \
            -name 'libshared.so' -o \
            -name 'libshared.so.*' -o \
            -name 'libshared.a' \
          \) -print | sed -n '1,200p'

          echo "===== 6. Inspect symlink targets ====="
          find . -type l \( \
            -name 'libnvram.so' -o \
            -name 'libshared.so' \
          \) -exec ls -l {} \; | sed -n '1,100p'

          echo "===== Diagnostic complete; firmware build was NOT started ====="
          DIAG_SCRIPT

          chmod +x /tmp/diagnose-libraries.sh
          chown docker:docker /tmp/diagnose-libraries.sh

          echo "===== 7. Run diagnostic as non-root ====="
          set +e
          su -s /bin/bash docker -c \
            'export GITHUB_WORKSPACE="'"$GITHUB_WORKSPACE"'"; bash /tmp/diagnose-libraries.sh' \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          diagnostic_status=${PIPESTATUS[0]}
          set -e

          echo "$diagnostic_status" > "$GITHUB_WORKSPACE/build-exit-code.txt"

          if [ "$diagnostic_status" -ne 0 ]; then
            echo "Diagnostic failed with exit code $diagnostic_status"
            exit "$diagnostic_status"
          fi

          echo "===== Diagnostic command completed successfully ====="

      - name: Collect diagnostic results
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" \
              "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          if [ -f "$GITHUB_WORKSPACE/build-exit-code.txt" ]; then
            cp "$GITHUB_WORKSPACE/build-exit-code.txt" \
              "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          echo "===== Collected files ====="
          find "$GITHUB_WORKSPACE/build-artifacts" \
            -type f -printf '%p (%s bytes)\n' || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuf-ax3000-v2-library-diagnostics
          path: build-artifacts/
          if-no-files-found: warn
          retention-days: 7
