
name: Check TUF-AX3000 V2 Library Build Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user 0:0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -eo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19.sh

          ln -sfn /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains

          echo "===== Compiler ====="
          command -v arm-buildroot-linux-gnueabi-gcc
          arm-buildroot-linux-gnueabi-gcc --version

          echo "===== SDK directory ====="
          test -d "$GITHUB_WORKSPACE/release/src-rt-5.04axhnd.675x"
          echo "SDK directory exists"

      - name: Check library build rules
        shell: bash
        run: |
          set -eo pipefail

          echo "===== 1. Prepare workspace ====="
          chown -R docker:docker "$GITHUB_WORKSPACE"

          cat > /tmp/check-library-rules.sh <<'CHECK_SCRIPT'
          #!/bin/bash
          set -eo pipefail

          export LD_LIBRARY="${LD_LIBRARY:-}"
          source /home/docker/envs/bcm-hnd-ax-4.19.sh

          cd "$GITHUB_WORKSPACE/release/src-rt-5.04axhnd.675x"

          echo "===== 2. Confirm target profile ====="
          grep -nE 'HND-96756_BASE|TUF-AX3000_V2' target.mak

          echo "===== 3. Check active NVRAM library ====="
          if [ -f router-sysdep/wlan/nvram/prebuilt/libnvram.so ]; then
            ls -l router-sysdep/wlan/nvram/prebuilt/libnvram.so
            file router-sysdep/wlan/nvram/prebuilt/libnvram.so
          else
            echo "NVRAM library not found in active router-sysdep"
          fi

          echo "===== 4. Search NVRAM build/install rules ====="
          grep -RInE \
            --include='Makefile' \
            --include='*.mak' \
            --include='*.mk' \
            'libnvram\.so|install/nvram/usr/lib|nvram.*prebuilt' \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router-sysdep \
            router-sysdep \
            2>/dev/null | sed -n '1,120p' || true

          echo "===== 5. Search shared library build/install rules ====="
          grep -RInE \
            --include='Makefile' \
            --include='*.mak' \
            --include='*.mk' \
            'libshared\.so|install/shared/usr/lib|shared\.a' \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src \
            router \
            2>/dev/null | sed -n '1,180p' || true

          echo "===== 6. Find actual shared libraries ====="
          find bcmdrivers/broadcom/net/wl/bcm96756/main/src router \
            \( -type f -o -type l \) \
            \( -name 'libshared.so*' -o -name 'libshared.a' \) \
            -print 2>/dev/null | sed -n '1,120p'

          echo "===== 7. Check expected installation directories ====="
          for d in \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/arm-glibc/install/nvram/usr/lib \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/arm-glibc/install/shared/usr/lib \
            bcmdrivers/broadcom/net/wl/bcm96756/main/src/router/shared \
            router-sysdep/wlan/nvram/prebuilt
          do
            echo "----- $d -----"
            if [ -d "$d" ]; then
              echo "DIRECTORY EXISTS"
              ls -ld "$d"
            else
              echo "DIRECTORY MISSING"
            fi
          done

          echo "===== 8. Check NVRAM Makefile ====="
          if [ -f router-sysdep/wlan/nvram/Makefile ]; then
            sed -n '1,120p' router-sysdep/wlan/nvram/Makefile
          else
            echo "No Makefile at router-sysdep/wlan/nvram/Makefile"
          fi

          echo "===== Library rule check complete; no firmware build started ====="
          CHECK_SCRIPT

          chmod +x /tmp/check-library-rules.sh
          chown docker:docker /tmp/check-library-rules.sh

          echo "===== 9. Run check as non-root ====="
          set +e
          su -s /bin/bash docker -c \
            'export GITHUB_WORKSPACE="'"$GITHUB_WORKSPACE"'"; bash /tmp/check-library-rules.sh' \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          check_status=${PIPESTATUS[0]}
          set -e

          echo "$check_status" > "$GITHUB_WORKSPACE/build-exit-code.txt"

          if [ "$check_status" -ne 0 ]; then
            echo "Library rule check failed with exit code $check_status"
            exit "$check_status"
          fi

          echo "===== Library rule check completed successfully ====="

      - name: Collect diagnostic logs
        if: always()
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          if [ -f "$GITHUB_WORKSPACE/build-exit-code.txt" ]; then
            cp "$GITHUB_WORKSPACE/build-exit-code.txt" "$GITHUB_WORKSPACE/build-artifacts/"
          fi

          echo "===== Collected files ====="
          find "$GITHUB_WORKSPACE/build-artifacts" -type f -printf '%p (%s bytes)\n' || true

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuf-ax3000-v2-library-rule-check
          path: build-artifacts/
          if-no-files-found: warn
          retention-days: 7
