      - name: Diagnose missing build directories
        shell: bash
        run: |
          set -eo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "===== 1. Git submodule status ====="
          git submodule status || true

          echo "===== 2. Git submodule configuration ====="
          if [ -f .gitmodules ]; then
            cat .gitmodules
          else
            echo "No .gitmodules file at repository root"
          fi

          echo "===== 3. Relevant source directories ====="
          for dir in \
            release/src-rt \
            release/src-rt-5.04axhnd.675x \
            release/src-rt/targets \
            release/src-rt-5.04axhnd.675x/targets \
            release/src-rt-5.04axhnd.675x/bcmdrivers \
            release/src-rt-5.04axhnd.675x/bcmdrivers/broadcom/net/wl \
            release/src-rt/bcmdrivers/broadcom/net/wl
          do
            if [ -e "$dir" ]; then
              ls -ld "$dir"
            else
              echo "MISSING: $dir"
            fi
          done

          echo "===== 4. Locate PROFILE target directories ====="
          find release -type d \
            \( -name '96756GW' -o -name 'targets' \) \
            -print 2>/dev/null | head -n 150

          echo "===== 5. Inspect source links ====="
          for path in \
            release/src-rt/Makefile \
            release/src-rt/platform.mak \
            release/src-rt-5.04axhnd.675x/Makefile \
            release/src-rt-5.04axhnd.675x/bcmdrivers
          do
            if [ -L "$path" ]; then
              echo "SYMLINK: $path -> $(readlink "$path")"
              if [ ! -e "$path" ]; then
                echo "BROKEN LINK: $path"
              fi
            elif [ -e "$path" ]; then
              echo "EXISTS: $path"
            else
              echo "MISSING: $path"
            fi
          done

          echo "===== 6. Locate Broadcom wireless driver directories ====="
          find release -type d \
            -path '*/bcmdrivers/broadcom/net/wl' \
            -print 2>/dev/null | head -n 50

          echo "===== 7. Relevant Makefile variables ====="
          grep -n -E 'HND_SRC|PROFILE|BRCM_BOARD_ID|bcmdrivers/broadcom/net/wl' \
            release/src-rt/Makefile \
            release/src-rt/platform.mak \
            release/src-rt/target.mak | head -n 160 || true

          echo "===== Diagnostics complete; build intentionally skipped ====="
		  
