name: Diagnose BCM6756 Build Config

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user 0:0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect build configuration
        shell: bash
        run: |
          set -eo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          mkdir -p diagnostics

          {
            echo "===== Revision ====="
            git rev-parse HEAD

            echo
            echo "===== Build configuration definitions ====="
            grep -nE 'HND_SRC|SRCBASE|PROFILE|HND_ROUTER_AX_675X|HND_ROUTER_AX_6756|96756GW|BUILD_NAME|BRCM_BOARD_ID|BOARD_ID' \
              release/src-rt/Makefile \
              release/src-rt/platform.mak \
              release/src-rt/target.mak \
              release/src-rt-5.04axhnd.675x/Makefile \
              release/src-rt-5.04axhnd.675x/platform.mak \
              2>/dev/null || true

            echo
            echo "===== 96756GW target directory ====="
            find release/src-rt-5.04axhnd.675x/targets/96756GW \
              -maxdepth 2 -print 2>/dev/null | head -100 || true

            echo
            echo "===== TUF AX3000 V2 target files ====="
            find release/src-rt-5.04axhnd.675x/targets \
              -maxdepth 3 -iname '*TUF*AX3000*V2*' \
              -print 2>/dev/null | head -100 || true

            echo
            echo "===== Relevant SDK symlinks ====="
            ls -ld \
              release/src-rt-5.04axhnd.675x/Makefile \
              release/src-rt-5.04axhnd.675x/platform.mak \
              release/src-rt-5.04axhnd.675x/target.mak \
              release/src-rt/Makefile \
              release/src-rt/platform.mak \
              release/src-rt/target.mak \
              2>&1 || true

            echo
            echo "===== Build profile definitions ====="
            grep -nE '^(TUF-AX3000_V2|HND-96756_BASE|RT-AX58U_V2|RP-AX58)[[:space:]:?+]?=' \
              release/src-rt/target.mak \
              release/src-rt-5.04axhnd.675x/target.mak \
              2>/dev/null || true

            echo
            echo "===== End of diagnostics ====="
          } 2>&1 | tee diagnostics/build-config.txt

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcm6756-build-config
          path: diagnostics/build-config.txt
          if-no-files-found: warn
          retention-days: 7
